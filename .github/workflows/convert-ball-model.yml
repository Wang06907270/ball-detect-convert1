name: Convert Ball Detection ONNX → CVIModel

on:
  push:
    paths:
      - 'convert/ball_export.onnx'
      - 'convert/calib_images/**'
      - '.github/workflows/convert-ball-model.yml'
  workflow_dispatch:  # 手动触发

jobs:
  convert:
    runs-on: ubuntu-latest
    container:
      image: sophgo/tpuc_dev:latest
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tpu_mlir
        run: |
          pip install tpu_mlir*.whl 2>/dev/null || pip install tpu_mlir
        working-directory: /workspace

      - name: ONNX → MLIR
        run: |
          model_transform.py \
            --model_name ball_detect \
            --model_def $GITHUB_WORKSPACE/convert/ball_export.onnx \
            --input_shapes [[1,3,224,320]] \
            --pixel_format RGB \
            --mean 0,0,0 \
            --scale 0.0039216,0.0039216,0.0039216 \
            --keep_aspect_ratio \
            --mlir ball_detect.mlir

      - name: INT8 Calibration
        run: |
          run_calibration.py \
            ball_detect.mlir \
            --dataset $GITHUB_WORKSPACE/convert/calib_images \
            --input_num 100 \
            -o ball_detect_cali_table

      - name: MLIR → CVIModel
        run: |
          model_deploy.py \
            --mlir ball_detect.mlir \
            --quantize INT8 \
            --calibration_table ball_detect_cali_table \
            --processor cv181x \
            --model ball_detect_int8.cvimodel

      - name: Upload CVIModel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ball_detect_cvimodel
          path: |
            ball_detect_int8.cvimodel
          retention-days: 90

      - name: Show model info
        run: |
          ls -lh *.cvimodel
          echo "=== 模型转换完成 ==="
          echo "下载 ball_detect_int8.cvimodel 放到 convert/cvimodel/"
          echo "和 ball_detect.mud 一起上传到 MaixCAM /root/models/"
