name: Convert Digit Classifier ONNX → CVIModel

on:
  push:
    paths:
      - 'digit_detect/models/best.onnx'
      - 'digit_detect/calib_images/**'
      - '.github/workflows/convert-digit-model.yml'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    container:
      image: sophgo/tpuc_dev:latest
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tpu_mlir
        run: pip install tpu_mlir*.whl 2>/dev/null || pip install tpu_mlir

      - name: ONNX → MLIR
        run: |
          model_transform.py \
            --model_name digit_cls \
            --model_def $GITHUB_WORKSPACE/digit_detect/models/best.onnx \
            --input_shapes [[1,3,224,224]] \
            --pixel_format RGB \
            --mean 0,0,0 \
            --scale 0.0039216,0.0039216,0.0039216 \
            --mlir digit_cls.mlir

      - name: INT8 Calibration
        run: |
          run_calibration.py \
            digit_cls.mlir \
            --dataset $GITHUB_WORKSPACE/digit_detect/calib_images \
            --input_num 50 \
            -o digit_cls_cali_table

      - name: MLIR → CVIModel
        run: |
          model_deploy.py \
            --mlir digit_cls.mlir \
            --quantize INT8 \
            --calibration_table digit_cls_cali_table \
            --processor cv181x \
            --model digit_cls_int8.cvimodel

      - name: Upload CVIModel
        uses: actions/upload-artifact@v4
        with:
          name: digit_cls_cvimodel
          path: digit_cls_int8.cvimodel
          retention-days: 90
